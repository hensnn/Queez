<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Queez – kvízová hra">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ff6b4a"/>
      <stop offset="1" stop-color="#8b3df0"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="2.4" fill="#fff" fill-opacity="0.25"/>
    </pattern>
    <symbol id="icon" viewBox="0 0 128 128">
      <rect x="4" y="4" width="120" height="120" rx="28" fill="#fff7e8" stroke="#2d1b3d" stroke-width="6"/>
      <g stroke="#2d1b3d" stroke-width="4">
        <rect x="18" y="18" width="46" height="46" rx="12" fill="#ff4d6d"/>
        <rect x="66" y="18" width="46" height="46" rx="12" fill="#3d8bff"/>
        <rect x="18" y="66" width="46" height="46" rx="12" fill="#ffb703"/>
        <rect x="66" y="66" width="46" height="46" rx="12" fill="#23c26b"/>
      </g>
      <g fill="#fff" stroke="#2d1b3d" stroke-width="3">
        <circle cx="41" cy="41" r="13"/><circle cx="89" cy="41" r="13"/>
        <circle cx="41" cy="89" r="13"/><circle cx="89" cy="89" r="13"/>
      </g>
      <polygon points="41,33 49,47 33,47" fill="#ff4d6d"/>
      <polygon points="89,33 96,41 89,49 82,41" fill="#3d8bff"/>
      <circle cx="41" cy="89" r="5" fill="#ffb703"/>
      <rect x="84" y="84" width="10" height="10" rx="2" fill="#23c26b"/>
    </symbol>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#dots)"/>
  <rect x="3" y="3" width="1194" height="294" rx="26" fill="none" stroke="#2d1b3d" stroke-width="6"/>

  <!-- konfety -->
  <g opacity="0.95">
    <rect x="900" y="40" width="16" height="26" rx="4" fill="#ffc233" transform="rotate(25 908 53)"/>
    <rect x="1050" y="236" width="16" height="26" rx="4" fill="#23c26b" transform="rotate(-30 1058 249)"/>
    <rect x="1080" y="70" width="16" height="26" rx="4" fill="#3d8bff" transform="rotate(15 1088 83)"/>
    <rect x="1130" y="190" width="16" height="26" rx="4" fill="#ff4d6d" transform="rotate(40 1138 203)"/>
    <rect x="1150" y="110" width="16" height="26" rx="4" fill="#9b5de5" transform="rotate(-15 1158 123)"/>
    <rect x="1030" y="30" width="16" height="26" rx="4" fill="#14c8c8" transform="rotate(-25 1038 43)"/>
  </g>

  <use href="#icon" x="70" y="55" width="190" height="190"/>

  <g font-family="Nunito, 'Arial Rounded MT Bold', 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-weight="900">
    <text x="310" y="168" font-size="112" fill="#fff" stroke="#2d1b3d" stroke-width="12" stroke-linejoin="round" paint-order="stroke">Queez</text>
    <text x="316" y="232" font-size="34" font-weight="800" fill="#fff7e8" stroke="#2d1b3d" stroke-width="7" stroke-linejoin="round" paint-order="stroke">Kvízová hra pro hospodu, přátele i školení</text>
  </g>
</svg>
