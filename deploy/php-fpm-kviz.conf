; PHP-FPM pooly pro aplikaci Kvíz.
; Zkopírujte do /etc/php/<verze>/fpm/pool.d/kviz.conf (verzi zjistíte příkazem: ls /etc/php)
; Po úpravě:  sudo php-fpm<verze> -t   (kontrola)  a  sudo systemctl reload php<verze>-fpm
;
; Dva pooly:
;   [kviz]       – hra: rychlé krátké požadavky (polling, odpovědi). Zaseknutý požadavek se po 20 s ukončí.
;   [kviz-slow]  – pomalé úlohy (Gemini generování, Gemini TTS, záloha/obnova DB). Jsou jen 3 pracovníci,
;                  takže i několik zároveň spuštěných generování nikdy neobsadí pracovníky určené hráčům.
;
; Pool [www] (výchozí) NEVYPÍNEJTE, pokud na serveru běží i jiné PHP weby – používají jeho socket.
;
; Caddy sedí v LXC jako uživatel "caddy" a musí na sockety dosáhnout (listen.group = caddy).

[kviz]
user = www-data
group = www-data
listen = /run/php/kviz.sock
listen.owner = www-data
listen.group = caddy
listen.mode = 0660

; --- počet pracovníků (viz README, kapitola "Kolik pracovníků nastavit") ---
pm = dynamic
pm.max_children = 25
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
; po 500 požadavcích se pracovník restartuje (brání pomalému nárůstu paměti)
pm.max_requests = 500

; zaseknutý požadavek nesmí blokovat pracovníka
request_terminate_timeout = 20s

catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 64M
php_admin_value[post_max_size] = 40M
php_admin_value[upload_max_filesize] = 32M
; Volitelné zpřísnění (odkomentujte až po odzkoušení, že vše funguje; cestu upravte podle umístění aplikace):
;php_admin_value[open_basedir] = /var/www/kviz/:/tmp/


[kviz-slow]
user = www-data
group = www-data
listen = /run/php/kviz-slow.sock
listen.owner = www-data
listen.group = caddy
listen.mode = 0660

pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 30s
pm.max_requests = 200

; Gemini může odpovídat až ~100 s
request_terminate_timeout = 130s

catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 128M
php_admin_value[post_max_size] = 40M
php_admin_value[upload_max_filesize] = 32M
php_admin_value[max_execution_time] = 130
